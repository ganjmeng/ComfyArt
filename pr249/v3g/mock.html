<!doctype html><html><head><meta charset="utf-8"><style>

.stage{height:176px}.hint{bottom:4px;font-size:10px;color:var(--ca-muted);opacity:.75}
.pvb{font-size:12px;font-weight:500;color:var(--sub);padding:0 6px;height:24px;line-height:24px;border-radius:6px}.hda{display:flex;align-items:center;gap:2px}
.four{margin-top:12px;height:32px;border-radius:8px;border:var(--ca-border-w) solid var(--ca-active);display:flex;align-items:center;justify-content:center;font-weight:500}

.cancel{flex:1}
#view{position:absolute;inset:0;border-radius:8px;overflow:hidden}#view canvas{display:block;width:100%!important;height:100%!important}.rd{text-align:center;color:var(--ca-muted);font-size:11px;margin-top:6px}

function floorGrid(cx,cy,s,yaw,pitch,y0,ext,ring){let o='';for(let i=-ext;i<=ext;i++){for(const [a,b] of [[[i,y0,-ext],[i,y0,ext]],[[-ext,y0,i],[ext,y0,i]]]){const A=P3(a,yaw,pitch),B=P3(b,yaw,pitch);o+=`<line x1="${cx+A[0]*s}" y1="${cy-A[1]*s}" x2="${cx+B[0]*s}" y2="${cy-B[1]*s}"/>`}}

function sphereSVG(W=236,H=172){
