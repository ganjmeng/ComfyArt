<!doctype html><html><head><meta charset=utf-8>
<style>
html,body{margin:0;background:transparent}
.stage{position:relative;width:286px;height:240px;border-radius:12px;overflow:hidden;background:var(--bg)}
html[data-theme=light]{--bg:#f5f5f5;--ca-float:#fff;--ca-border:#e5e5e5;--ca-border-w:.5px;--sub:#737373}
html[data-theme=dark]{--bg:#232323;--ca-float:#2a2a2a;--ca-border:#3a3a3a;--ca-border-w:.5px;--sub:#a3a3a3}
.st3{display:block;margin:0 auto}
.ro{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;background:var(--ca-float);border:var(--ca-border-w) solid var(--ca-border);font:10.5px/20px Inter,"PingFang SC","Noto Sans SC",sans-serif;color:var(--sub);font-variant-numeric:tabular-nums;box-shadow:0 1px 2px rgba(0,0,0,.06);z-index:2}
.ro b{font-weight:500}.ro i{width:1px;height:10px;background:var(--ca-border);display:inline-block}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:11px/1 Inter,"PingFang SC",sans-serif;color:var(--sub);opacity:.65;pointer-events:none}
</style></head><body>
<div class="stage" id="stage"></div>
<script>
const q=new URLSearchParams(location.search);
const L=q.get('lang')||'zh', T=q.get('theme')||'light', TAB=q.get('tab')||'object';
const h=+(q.get('h')||45), v=+(q.get('v')||0), z=+(q.get('z')||5);
const four=false;
document.documentElement.dataset.theme=T;
const rot=((h+180)%360)-180;
// Object gizmo: slight downward view so top face + floor grid read at v=0 (eye-level).
// Camera sphere uses true v for handle position.
const tilt=TAB==='object'?(v+18):v;
const zoom=z>=7?0:z>=3?1:2;
const art=`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" class="art"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d7a7"/><stop offset="1" stop-color="#e9a86b"/></linearGradient><linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a5f34"/><stop offset="1" stop-color="#5e3519"/></linearGradient></defs><rect width="100" height="58" fill="url(#sky)"/><rect x="58" y="6" width="34" height="40" rx="1" fill="#fff6e6" opacity=".75"/><line x1="75" y1="6" x2="75" y2="46" stroke="#e2c49b" stroke-width="1.2"/><rect y="56" width="100" height="44" fill="url(#tb)"/><ellipse cx="50" cy="80" rx="22" ry="5" fill="#000" opacity=".25"/><path d="M33 58 h34 l-3 22 q-14 5 -28 0z" fill="#efe7da"/><ellipse cx="50" cy="58" rx="17" ry="3.6" fill="#3a2414"/><path d="M67 62 q9 1 7 8 q-2 5 -9 4" fill="none" stroke="#efe7da" stroke-width="3"/><circle cx="18" cy="38" r="9" fill="#5f8f4e"/><circle cx="12" cy="28" r="7" fill="#76a862"/><rect x="10" y="44" width="14" height="14" rx="2" fill="#e9e1d3"/></svg>`;
const D2R=Math.PI/180;
function P3(p,yaw,pitch){const t=yaw*D2R,f=pitch*D2R;const x=p[0]*Math.cos(t)+p[2]*Math.sin(t),z1=-p[0]*Math.sin(t)+p[2]*Math.cos(t);const y=p[1]*Math.cos(f)-z1*Math.sin(f),z=p[1]*Math.sin(f)+z1*Math.cos(f);return [x,y,z]}
const dark=T==='dark',FACE=dark?'#2a2a2a':'#ffffff',EDGE=dark?'rgba(255,255,255,.28)':'rgba(0,0,0,.18)',LBL=dark?'rgba(255,255,255,.42)':'rgba(0,0,0,.28)',GRID=dark?'rgba(255,255,255,.10)':'rgba(0,0,0,.08)',ACC='#3b82f6';
const ZL=L==='zh'?['特写','中景','远景']:['Close','Medium','Wide'];
const FL=L==='zh'?{r:'右',l:'左',b:'背',t:'顶',d:'底'}:{r:'R',l:'L',b:'B',t:'T',d:'Bt'};
const hOf=r=>((r%360)+360)%360;
function readout(){return `<div class="ro"><b>${L==='zh'?'水平':'H'} ${four?'4×':hOf(rot)+'°'}</b><i></i><b>${L==='zh'?'垂直':'V'} ${tilt}°</b><i></i><b>${ZL[zoom]}</b></div>`}
function floorGrid(cx,cy,s,yaw,pitch,y0,ext,ring){let o='';for(let i=-ext;i<=ext;i++){for(const [a,b] of [[[i,y0,-ext],[i,y0,ext]],[[-ext,y0,i],[ext,y0,i]]]){const A=P3(a,yaw,pitch),B=P3(b,yaw,pitch);o+=`<line x1="${cx+A[0]*s}" y1="${cy-A[1]*s}" x2="${cx+B[0]*s}" y2="${cy-B[1]*s}"/>`}}
 let pts=[];for(let k=0;k<=72;k++){const a=k*5*D2R;const p=P3([Math.sin(a)*ring,y0,Math.cos(a)*ring],yaw,pitch);pts.push((cx+p[0]*s).toFixed(1)+','+(cy-p[1]*s).toFixed(1))}
 return `<defs><radialGradient id="fg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient><mask id="fm"><ellipse cx="${cx}" cy="${cy+ (pitch>0?10:30)}" rx="${s*ext*1.1}" ry="${s*ext*.55}" fill="url(#fg)"/></mask></defs><g mask="url(#fm)" stroke="${GRID}" stroke-width=".6" opacity=".55">${o}</g><polyline points="${pts.join(' ')}" fill="none" stroke="${EDGE}" stroke-width="1" stroke-dasharray="2 3"/>`}
function ringDot(cx,cy,s,yaw,pitch,y0,ring,h,on){const a=h*D2R,p=P3([Math.sin(a)*ring,y0,Math.cos(a)*ring],yaw,pitch);return `<circle cx="${cx+p[0]*s}" cy="${cy-p[1]*s}" r="${on?3.6:2.4}" fill="${on?ACC:FACE}" stroke="${on?'#fff':EDGE}" stroke-width="1"/>`}
function cubeSVG(W=236,H=172){
 const cx=W/2,cy=H/2+2,s=[44,37,30][zoom],yaw=-rot,pitch=tilt;
 const F=[['f',[-1,1,1],[2,0,0],[0,-2,0],[0,0,1]],['r',[1,1,1],[0,0,-2],[0,-2,0],[1,0,0]],['b',[1,1,-1],[-2,0,0],[0,-2,0],[0,0,-1]],['l',[-1,1,-1],[0,0,2],[0,-2,0],[-1,0,0]],['t',[-1,1,-1],[2,0,0],[0,0,2],[0,1,0]],['d',[-1,-1,1],[2,0,0],[0,0,-2],[0,-1,0]]];
 const Lt=[-.45,.75,.5];const ln=Math.hypot(...Lt);
 let faces=F.map(([k,o,u,v,n])=>{const nn=P3(n,yaw,pitch);const O=P3(o,yaw,pitch),U=P3(u,yaw,pitch),V=P3(v,yaw,pitch);const c=P3(n,yaw,pitch);return {k,nz:nn[2],z:c[2],m:[U[0]*s,-U[1]*s,V[0]*s,-V[1]*s,cx+O[0]*s,cy-O[1]*s],sh:(n[0]*Lt[0]+n[1]*Lt[1]+n[2]*Lt[2])/ln}}).filter(f=>f.nz>0.02).sort((a,b)=>a.z-b.z);
 const shadowY=-1.55;const sp=[[-1.1,shadowY,-1.1],[1.1,shadowY,-1.1],[1.1,shadowY,1.1],[-1.1,shadowY,1.1]].map(p=>P3(p,yaw,pitch)).map(p=>`${cx+p[0]*s},${cy-p[1]*s+4}`).join(' ');
 let g=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="st3"><defs><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter><clipPath id="fc" clipPathUnits="userSpaceOnUse"><rect x=".012" y=".012" width=".976" height=".976" rx=".09"/></clipPath><linearGradient id="hl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
 g+=floorGrid(cx,cy,s,yaw,pitch,-1.6,3,2.2);
 if(four)[-90,-45,45,90].forEach(h=>g+=ringDot(cx,cy,s,yaw,pitch,-1.6,2.2,h-rot+rot,true));
 g+=`<polygon points="${sp}" fill="#000" opacity="${dark?.35:.07}" filter="url(#bl)"/>`;
 const VV=[];for(const x of[-1,1])for(const y of[-1,1])for(const z of[-1,1]){const p=P3([x,y,z],yaw,pitch);VV.push({w:[x,y,z],x:cx+p[0]*s,y:cy-p[1]*s})}
 const vis=n=>P3(n,yaw,pitch)[2]>0.02;
 const fillA=dark?'rgba(255,255,255,.07)':'rgba(255,255,255,.82)',edgeS=dark?'rgba(255,255,255,.42)':'rgba(0,0,0,.26)',edgeH=dark?'rgba(255,255,255,.2)':'rgba(0,0,0,.14)';
 // hidden edges first
 let eF='',eB='';for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){const a=VV[i].w,b=VV[j].w;const diff=[0,1,2].filter(k=>a[k]!==b[k]);if(diff.length!==1)continue;const k=diff[0];const n1=[0,0,0],n2=[0,0,0];const o=[0,1,2].filter(t=>t!==k);n1[o[0]]=a[o[0]];n2[o[1]]=a[o[1]];const seg=`M${VV[i].x.toFixed(2)} ${VV[i].y.toFixed(2)}L${VV[j].x.toFixed(2)} ${VV[j].y.toFixed(2)}`;if(vis(n1)||vis(n2))eF+=seg;else eB+=seg}
 g+=`<path d="${eB}" stroke="${edgeH}" stroke-width=".8" stroke-dasharray="2 2" fill="none"/>`;
 for(const f of faces){const b=Math.max(0,f.sh);const shade=dark?(0.25-0.2*b):(0.06-0.06*b);const m=f.m.map(x=>x.toFixed(3)).join(',');
  g+=`<g transform="matrix(${m})"><rect width="1" height="1" fill="${fillA}"/>`;
  if(f.k==='f'){g+=`<clipPath id="fq"><path d="M.14 0H1V1H0V.14Q0 0 .14 0Z"/></clipPath><g clip-path="url(#fq)"><g transform="scale(.01)">${art.replace('class="art"','width="100" height="100"')}</g></g><path d="M.14 0H1V1H0V.14Q0 0 .14 0Z" fill="none" stroke="${ACC}" stroke-opacity=".55" stroke-width=".9" vector-effect="non-scaling-stroke"/>`}
  else{g+=`<text x=".5" y=".56" text-anchor="middle" font-size=".16" font-weight="400" fill="${dark?'rgba(255,255,255,.45)':'rgba(0,0,0,.38)'}" font-family="Inter,PingFang SC,Noto Sans CJK SC,sans-serif">${FL[f.k]}</text>`}
  g+=`<rect width="1" height="1" fill="#000" opacity="${shade.toFixed(3)}"/></g>`}
 g+=`<path d="${eF}" stroke="${edgeS}" stroke-width=".9" stroke-linejoin="round" fill="none"/>`;
 const ar=`stroke="${dark?'rgba(255,255,255,.28)':'rgba(0,0,0,.2)'}" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
 g+=`<path d="M${cx-40} ${H-24} Q${cx} ${H-13} ${cx+40} ${H-24}" ${ar}/><path d="M${cx-40} ${H-24} l5 -1 M${cx-40} ${H-24} l2.5 4 M${cx+40} ${H-24} l-5 -1 M${cx+40} ${H-24} l-2.5 4" ${ar}/>`;
 g+=`<path d="M${W-24} ${cy-34} Q${W-14} ${cy} ${W-24} ${cy+34}" ${ar}/><path d="M${W-24} ${cy-34} l1 5 M${W-24} ${cy-34} l4 2.5 M${W-24} ${cy+34} l1 -5 M${W-24} ${cy+34} l4 -2.5" ${ar}/>`;
 return g+'</svg>'}
function sphereSVG(W=236,H=172){
 const cx=W/2,cy=H/2+6,R=48,vy=-25,vp=14;let g=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="st3"><defs><filter id="bl2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>`;
 g+=`<ellipse cx="${cx}" cy="${cy+R+12}" rx="${R*.8}" ry="7" fill="#000" opacity="${dark?.5:.10}" filter="url(#bl2)"/>`;
 const circ=(fn,hi)=>{let fr='',bk='';let prev=null;for(let k=0;k<=96;k++){const p=P3(fn(k/96*2*Math.PI),vy,vp);const pt=[cx+p[0]*R,cy-p[1]*R];if(prev){const seg=`M${prev[0].toFixed(1)} ${prev[1].toFixed(1)}L${pt[0].toFixed(1)} ${pt[1].toFixed(1)}`;if(p[2]>=0)fr+=seg;else bk+=seg}prev=pt}
  return `<path d="${bk}" stroke="${hi||EDGE}" stroke-width="${hi?1.1:.7}" opacity=".45" stroke-dasharray="2 2" fill="none"/><path d="${fr}" stroke="${hi||EDGE}" stroke-width="${hi?1.4:.8}" fill="none"/>`};
 g+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${EDGE}" stroke-width=".9"/>`;
 for(const m of [0,45,90,135])g+=circ(a=>[Math.sin(m*D2R)*Math.cos(a),Math.sin(a),Math.cos(m*D2R)*Math.cos(a)]);
 for(const la of [-30,30,60])g+=circ(a=>[Math.cos(la*D2R)*Math.sin(a),Math.sin(la*D2R),Math.cos(la*D2R)*Math.cos(a)]);
 const hiC=dark?'rgba(255,255,255,.5)':'rgba(0,0,0,.38)';
 g+=circ(a=>[Math.sin(a),0,Math.cos(a)],hiC);
 const hr=rot*D2R;g+=circ(a=>[Math.sin(hr)*Math.cos(a),Math.sin(a),Math.cos(hr)*Math.cos(a)],hiC);
 // 4-angle markers
 if(four)for(const h of [-90,-45,45,90]){const a=h*D2R,v=tilt*D2R;const p=P3([Math.sin(a)*Math.cos(v),Math.sin(v),Math.cos(a)*Math.cos(v)],vy,vp);g+=`<circle cx="${cx+p[0]*R}" cy="${cy-p[1]*R}" r="3.2" fill="${ACC}" stroke="#fff"/>`}
 // image tile
 g+=`<g transform="translate(${cx-20} ${cy-20})"><rect width="40" height="40" rx="5" fill="${FACE}"/><svg width="40" height="40" viewBox="0 0 100 100">${art.replace(/class="art"/,'').replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</svg><rect width="40" height="40" rx="5" fill="none" stroke="${ACC}" stroke-width="1.4"/></g>`;
 // camera
 const d=[.78,1,1.22][zoom],a=hr,v=tilt*D2R,p=P3([Math.sin(a)*Math.cos(v)*d,Math.sin(v)*d,Math.cos(a)*Math.cos(v)*d],vy,vp);const X=cx+p[0]*R,Y=cy-p[1]*R,sc=1+p[2]*.18;
 g+=`<line x1="${cx}" y1="${cy}" x2="${X}" y2="${Y}" stroke="${ACC}" stroke-width="1" stroke-dasharray="3 2"/>`;
 const ang=Math.atan2(cy-Y,cx-X)/D2R;
 g+=`<g transform="translate(${X} ${Y}) scale(${sc}) rotate(${ang})"><circle r="13" fill="${ACC}" opacity=".06"/><rect x="-9" y="-7" width="13" height="14" rx="3" fill="${FACE}" stroke="${dark?'rgba(255,255,255,.85)':'rgba(0,0,0,.5)'}" stroke-width="1"/><path d="M4 -4 L10 -6.5 V6.5 L4 4Z" fill="${FACE}" stroke="${dark?'rgba(255,255,255,.85)':'rgba(0,0,0,.5)'}" stroke-width="1" stroke-linejoin="round"/><circle cx="-2.5" cy="0" r="2.6" fill="${ACC}"/></g>`;
 const ch=`stroke="${dark?'rgba(255,255,255,.5)':'rgba(0,0,0,.35)'}" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
 g+=`<path d="M${cx-4} ${cy-R-8} l4 -4 l4 4" ${ch}/><path d="M${cx-4} ${cy+R+5} l4 4 l4 -4" ${ch}/><path d="M${cx-R-8} ${cy-4} l-4 4 l4 4" ${ch}/><path d="M${cx+R+8} ${cy-4} l4 4 l-4 4" ${ch}/>`;
 return g+'</svg>'}


function readoutMain(){
  return `<div class="ro"><b>${L==='zh'?'水平':'H'} ${h}°</b><i></i><b>${L==='zh'?'垂直':'V'} ${v}°</b><i></i><b>${L==='zh'?'远近':'Z'} ${z}</b></div>`;
}
// enlarge geometry for stage
const _cube=cubeSVG.toString().replace('s=[44,37,30][zoom]','s=[58,50,42][zoom]');
const cubeBig=eval('('+_cube+')');
const _sph=sphereSVG.toString()
  .replace('const cx=W/2,cy=H/2+6,R=48','const cx=W/2,cy=H/2+8,R=78')
  .replace('cy-R-8','cy-R-12').replace('cy+R+5','cy+R+10')
  .replace('cx-R-8','cx-R-12').replace('cx+R+8','cx+R+12');
const sphereBig=eval('('+_sph+')');
const hint=TAB==='object'?(L==='zh'?'拖动方块旋转主体':'Drag the cube to rotate'):(L==='zh'?'拖动相机环绕拍摄':'Drag the camera to orbit');
const svg=TAB==='object'?cubeBig(286,228):sphereBig(286,228);
document.getElementById('stage').innerHTML=svg+readoutMain()+`<div class="hint">${hint}</div>`;
</script></body></html>
