name: provider-settings

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test requirements
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Provider settings contract tests
        run: python -m pytest tests/test_provider_admin.py -q
        env:
          COMFYART_SKIP_NODE_TESTS: "1"
      # #935: the packaging pin locks used to read `e8c4a855:...` from history, which a
      # depth-1 checkout cannot resolve. They now compare literal sha256 values, so
      # run that pin file in CI (still depth 1; no fetch-depth change).
      - name: Packaging pin tests (shallow clone, no git history)
        run: python -m pytest tests/test_product_packaging_flow.py -q
        env:
          COMFYART_SKIP_NODE_TESTS: "1"
