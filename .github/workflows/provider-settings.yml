name: provider-settings

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Python packages this job imports
        run: python -m pip install pytest pytest-asyncio aiohttp sqlalchemy pillow pypdfium2
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Provider settings contract tests
        run: python -m pytest tests/test_provider_admin.py -q
        env:
          COMFYART_SKIP_NODE_TESTS: "1"
