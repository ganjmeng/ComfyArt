<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>#610 home starter harness</title>
<style>
:root {
  --ca-font: Inter, system-ui, sans-serif;
  --ca-border: rgba(0,0,0,.12);
  --ca-border-w: 1px;
  --ca-hover: rgba(0,0,0,.04);
  --ca-muted: rgba(0,0,0,.55);
  --ca-strong: #111;
  --ca-bg: #fff;
  --ca-panel: #fff;
  --ca-text: #111;
}
body { margin: 0; font-family: var(--ca-font); color: var(--ca-text); background: #fafafa; }
#shot { width: 800px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.composer {
  height: 114px; border: 1px solid var(--ca-border); border-radius: 24px;
  display:flex; align-items:flex-start; padding: 14px 16px; color: var(--ca-muted); font: 400 14px/22px var(--ca-font);
  margin-bottom: 16px;
}
.ca-landing__quick { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ca-landing__hint { font: 400 13px/20px var(--ca-font); color: var(--ca-muted); margin-right: 4px; }
.ca-landing__chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: var(--ca-border-w) solid var(--ca-border); border-radius: 9999px; background: transparent; color: inherit; font: 400 13px/20px var(--ca-font); cursor: pointer; }
.ca-landing__chip .ca-icon { width: 16px; height: 16px; display:inline-flex; }
.ca-landing__starter {
  width: 100%; max-width: 760px; box-sizing: border-box;
  padding: 12px 14px 14px; border: var(--ca-border-w) solid var(--ca-border);
  border-radius: 16px; background: var(--ca-panel);
  display: flex; flex-direction: column; gap: 10px;
}
.ca-landing__starter-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ca-landing__starter-icons { display: inline-flex; align-items: center; gap: 6px; }
.ca-landing__starter-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0; border: var(--ca-border-w) solid var(--ca-border);
  border-radius: 9999px; background: transparent; color: inherit; cursor: pointer;
}
.ca-landing__starter-icon[aria-pressed="true"], .ca-landing__starter-icon[data-on] {
  background: var(--ca-hover); border-color: var(--ca-strong);
}
.ca-landing__starter-icon .ca-icon { width: 16px; height: 16px; display:inline-flex; }
.ca-landing__starter-back {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; padding: 0; border: none; border-radius: 8px;
  background: transparent; color: inherit; cursor: pointer;
}
.ca-landing__starter-suggests { display: flex; flex-direction: column; gap: 8px; }
.ca-landing__starter-suggest {
  display: flex; align-items: flex-start; gap: 8px; width: 100%; box-sizing: border-box;
  padding: 10px 12px; border: var(--ca-border-w) solid var(--ca-border); border-radius: 12px;
  background: transparent; color: inherit; font: 400 13px/20px var(--ca-font);
  text-align: left; cursor: pointer;
}
.ca-landing__starter-suggest .ca-icon { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--ca-muted); display:inline-flex; }
.ca-landing__starter-suggest-text { flex: 1; min-width: 0; }
.caption { margin: 8px 0 0; font: 500 12px/16px var(--ca-font); color: var(--ca-muted); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="shot">
  <div class="composer" data-testid="composer">描述你想做的设计…（composer empty; rotating placeholder）</div>
  <div class="ca-landing__quick" data-testid="home-quick-row" id="quick-row"></div>
  <p class="caption" id="caption"></p>
</div>
<script>
const QUICK = [
  { id: 'ecommerce', tid: 'e_commerce', icon: '▣', label: '电商', suggests: [
    { skillId: 'product', text: '用「电商产品图」做电商主图套图' },
    { skillId: 'packaging', text: '用「包装设计」做货架包装设计' },
    { skillId: 'multi-angle', text: '用「多角度图像生成器」拍多角度商品图' },
  ]},
  { id: 'social', tid: 'social_media', icon: '▦', label: '社交媒体', suggests: [
    { skillId: 'social', text: '用「社交媒体套图」做社交媒体套图' },
    { skillId: 'thumbnail', text: '用「YouTube 缩略图」做高点击封面' },
    { skillId: 'social', text: '用「社交媒体套图」把卖点做成信息流推荐图' },
  ]},
  { id: 'brand', tid: 'branding', icon: '◇', label: '品牌', suggests: [
    { skillId: 'brand', text: '用「品牌识别」做品牌识别套件' },
    { skillId: 'logo-material', text: '用「Logo 材质探索」探索 Logo 材质' },
    { skillId: 'brand', text: '用「品牌识别」把品牌系统落到文具应用' },
  ]},
  { id: 'creative', tid: 'ads_creative', icon: '✦', label: '创意', suggests: [
    { skillId: 'poster', text: '用「海报设计」做印刷海报' },
    { skillId: 'banner', text: '用「横幅设计」做活动横幅' },
    { skillId: 'meta-ads', text: '用「Meta 投放创意」做投放创意套装' },
  ]},
  { id: 'website', tid: 'website', icon: '⌂', label: '网站', suggests: [
    { skillId: 'mobile-ui', text: '用「移动端应用视觉设计」做移动端界面' },
    { skillId: 'web-product', text: '用「Web 产品视觉设计」做网站产品视觉' },
    { skillId: 'web-product', text: '用「Web 产品视觉设计」排布网站功能模块' },
  ]},
];

let starter = null;
const row = document.getElementById('quick-row');
const caption = document.getElementById('caption');

function render() {
  row.innerHTML = '';
  if (starter) {
    const active = QUICK.find(q => q.id === starter) || QUICK[0];
    const card = document.createElement('div');
    card.className = 'ca-landing__starter';
    card.dataset.testid = 'ca-home-starter';
    card.setAttribute('data-testid', 'ca-home-starter');

    const bar = document.createElement('div');
    bar.className = 'ca-landing__starter-bar';
    const icons = document.createElement('div');
    icons.className = 'ca-landing__starter-icons';
    icons.setAttribute('role', 'group');
    icons.setAttribute('aria-label', '分类起步');
    QUICK.forEach(q => {
      const b = document.createElement('button');
      b.className = 'ca-landing__starter-icon';
      b.type = 'button';
      b.setAttribute('data-testid', `home-v3-starter-icon-${q.tid}`);
      b.setAttribute('aria-label', q.label);
      const pressed = starter === q.id;
      b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
      if (pressed) b.setAttribute('data-on', 'true');
      b.textContent = q.icon;
      b.onclick = () => { starter = q.id; render(); };
      icons.appendChild(b);
    });
    const back = document.createElement('button');
    back.className = 'ca-landing__starter-back';
    back.type = 'button';
    back.setAttribute('data-testid', 'home-v3-starter-back');
    back.setAttribute('aria-label', 'Close');
    back.textContent = '✕';
    back.onclick = () => { starter = null; render(); };
    bar.appendChild(icons);
    bar.appendChild(back);

    const suggests = document.createElement('div');
    suggests.className = 'ca-landing__starter-suggests';
    suggests.setAttribute('data-testid', 'home-starter-suggests');
    active.suggests.forEach(s => {
      const b = document.createElement('button');
      b.className = 'ca-landing__starter-suggest';
      b.type = 'button';
      b.setAttribute('data-testid', `home-starter-suggest-${s.skillId}`);
      b.setAttribute('data-skill', s.skillId);
      b.innerHTML = `<span class="ca-icon">✦</span><span class="ca-landing__starter-suggest-text">${s.text}</span>`;
      suggests.appendChild(b);
    });

    card.appendChild(bar);
    card.appendChild(suggests);
    row.appendChild(card);
    caption.textContent = `AFTER starter (${active.label} pressed) · Close = home-v3-starter-back · 3 suggestions · no prompt-fill · zh-light CSS harness`;
  } else {
    const hint = document.createElement('span');
    hint.className = 'ca-landing__hint';
    hint.textContent = '让智能体帮忙';
    row.appendChild(hint);
    QUICK.forEach(q => {
      const b = document.createElement('button');
      b.className = 'ca-landing__chip';
      b.type = 'button';
      b.setAttribute('data-testid', `home-v3-hero-chip-${q.tid}`);
      b.setAttribute('data-quick', q.id);
      b.innerHTML = `<span class="ca-icon">${q.icon}</span>${q.label}`;
      b.onclick = () => { starter = q.id; render(); };
      row.appendChild(b);
    });
    caption.textContent = 'AFTER pills L→R · zh-light · #610 soft mock (CSS classes from home.css) · Close restored';
  }
}

function applyScene(scene) {
  const map = {
    pills: null,
    ecommerce: 'ecommerce',
    social: 'social',
    brand: 'brand',
    creative: 'creative',
    website: 'website',
    close: null,
  };
  if (scene === 'close') {
    starter = 'ecommerce';
    render();
    // simulate Close after paint
    requestAnimationFrame(() => {
      starter = null;
      render();
    });
    return;
  }
  starter = Object.prototype.hasOwnProperty.call(map, scene) ? map[scene] : null;
  render();
}

const params = new URLSearchParams(location.search);
applyScene(params.get('scene') || 'pills');
window.__setScene = applyScene;
</script>
</body>
</html>
