<body>
<div class="shot-tag">#368 after · 记忆四组：基础信息 / 协作方式 / 审美偏好 / 常用资产</div>
<div id="shot">
  <h2 class="ca-arti__sectiontitle">我学会的</h2>
  <div class="ca-arti__tabs">
    <button type="button" class="ca-arti__tab" data-on>记忆</button>
    <button type="button" class="ca-arti__tab">自进化技能</button>
    <button type="button" class="ca-arti__tab">进化日志</button>
  </div>
  <div class="ca-arti-mem" data-testid="arti-memory-center">

      <section class="ca-arti-mem__group" data-testid="arti-memory-group-about">

        <div class="ca-arti-mem__list">
          <div class="ca-arti-mem__row" data-testid="arti-memory-row">
            <div class="ca-arti-mem__rowbody">
              <div class="ca-arti-mem__label">创作领域</div>
              <div class="ca-arti-mem__text">你长期从事咖啡与茶饮品牌的视觉内容创作，常涉及品牌识别、海报、包装及周边视觉。</div>
            </div>
            <div class="ca-arti-mem__actions">
              <button type="button" class="ca-arti-mem__iconbtn"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m18 5-2.414-2.414A2 2 0 0 0 14.172 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2"/><path d="M21.378 12.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg></span></button>
              <button type="button" class="ca-arti-mem__iconbtn"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></span></button>
            </div>
          </div>
        </div>
      </section>
      <section class="ca-arti-mem__group" data-testid="arti-memory-group-work">
        <h3 class="ca-arti-mem__grouptitle"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19m-3 7.2a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8m6 0a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8M8.2 15h7.6a4.2 4.2 0 0 1-7.6 0"/></svg></span>协作方式</h3>
        <div class="ca-arti-mem__list">
          <div class="ca-arti-mem__row"><div class="ca-arti-mem__rowbody"><div class="ca-arti-mem__label">指令风格</div><div class="ca-arti-mem__text">你习惯用简短直接的方式下达任务，不附加长篇背景，中英文交流都是如此。</div></div><div class="ca-arti-mem__actions"><button type="button" class="ca-arti-mem__iconbtn"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m18 5-2.414-2.414A2 2 0 0 0 14.172 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2"/><path d="M21.378 12.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg></span></button><button type="button" class="ca-arti-mem__iconbtn"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></span></button></div></div>
          <div class="ca-arti-mem__row"><div class="ca-arti-mem__rowbody"><div class="ca-arti-mem__label">输出形式</div><div class="ca-arti-mem__text">信息类任务里，你只要文字输出，不自动生成图片。</div></div><div class="ca-arti-mem__actions"><button type="button" class="ca-arti-mem__iconbtn"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m18 5-2.414-2.414A2 2 0 0 0 14.172 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2"/><path d="M21.378 12.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg></span></button><button type="button" class="ca-arti-mem__iconbtn"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></span></button></div></div>
          <div class="ca-arti-mem__row"><div class="ca-arti-mem__rowbody"><div class="ca-arti-mem__label">确认方式</div><div class="ca-arti-mem__text">关键步骤希望先出方案再动手；不确定时先问你。</div></div><div class="ca-arti-mem__actions"><button type="button" class="ca-arti-mem__iconbtn"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m18 5-2.414-2.414A2 2 0 0 0 14.172 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2"/><path d="M21.378 12.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg></span></button><button type="button" class="ca-arti-mem__iconbtn"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></span></button></div></div>
        </div>
      </section>
      <section class="ca-arti-mem__group" data-testid="arti-memory-group-taste">
        <h3 class="ca-arti-mem__grouptitle"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/></svg></span>审美偏好</h3>
        <div class="ca-arti-mem__list">
          <div class="ca-arti-mem__row"><div class="ca-arti-mem__rowbody"><div class="ca-arti-mem__label">视觉风格</div><div class="ca-arti-mem__text">偏好极简、几何构成与克莱因蓝方向，少装饰、强留白。</div></div><div class="ca-arti-mem__actions"><button type="button" class="ca-arti-mem__iconbtn"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m18 5-2.414-2.414A2 2 0 0 0 14.172 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2"/><path d="M21.378 12.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg></span></button><button type="button" class="ca-arti-mem__iconbtn"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></span></button></div></div>
        </div>
      </section>
      <section class="ca-arti-mem__group" data-testid="arti-memory-group-assets">
        <h3 class="ca-arti-mem__grouptitle"><span class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.5 7.5 12 4l7.5 3.5L12 11z"/><path d="M4.5 12 12 15.5 19.5 12M4.5 16.5 12 20l7.5-3.5"/></svg></span>常用资产</h3>

    </div>
