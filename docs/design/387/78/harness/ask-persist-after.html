<!doctype html>
<html lang="zh" data-theme="light" class="ca-root">
<meta charset="utf-8"/>
<title>#387 ask persist after refresh</title>
<link rel="stylesheet" href="tip.css"/>
<style>
  html,body{margin:0;background:#e8e8e8;}
  .frame{width:360px;margin:16px;padding:12px;border-radius:16px;
    background:var(--ca-float);color:var(--ca-text);box-shadow:var(--ca-shadow);}
  .tag{font:500 11px/14px var(--ca-font);color:var(--ca-muted);margin-bottom:10px;}
  .bubble{font:400 13px/18px var(--ca-font);margin-bottom:10px;color:var(--ca-text);}
</style>
<body>
<div class="frame" id="shot">
  <div class="tag">#387 after · 刷新后待答卡仍在（GET /asks → mergePendingAsks）</div>
  <div class="bubble">帮我做一张品牌海报——先确认几点偏好。</div>
  <div class="ca-q">
    <div class="ca-q__head">
      <div class="ca-q__label"><span class="ca-icon" style="width:13px;height:13px;opacity:.65">?</span>问题</div>
      <div class="ca-q__page">
        <button type="button" class="ca-q__chev" disabled aria-label="上一页">‹</button>
        <span>1 / 2</span>
        <button type="button" class="ca-q__chev" aria-label="下一页">›</button>
      </div>
    </div>
    <div class="ca-q__body">
      <div class="ca-q__block">
        <div class="ca-q__prompt">品牌名？</div>
        <div class="ca-q__opts">
          <button type="button" class="ca-q__opt" data-on="true"><span class="ca-q__letter">A</span><span class="ca-q__text">Aurora</span><span class="ca-q__rec">推荐</span></button>
          <button type="button" class="ca-q__opt"><span class="ca-q__letter">B</span><span class="ca-q__text">Nova</span></button>
        </div>
      </div>
    </div>
    <div class="ca-q__foot">
      <button type="button" class="ca-q__skip">跳过</button>
      <button type="button" class="ca-q__submit">下一步 <span class="ca-q__key">→</span></button>
    </div>
  </div>
</div>
<script>
  const t = new URLSearchParams(location.search).get('theme') || 'light';
  document.documentElement.dataset.theme = t;
  document.documentElement.className = 'ca-root';
</script>
</body></html>
