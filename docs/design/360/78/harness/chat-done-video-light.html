<!doctype html>
<html lang="zh" data-theme="light" class="ca-root">
<meta charset="utf-8"/>
<title>#360 chat-done-video light</title>
<link rel="stylesheet" href="tip.css"/>
<style>
  html,body{margin:0;background:#f0f0f0;}
  .frame{width:380px;margin:20px;padding:16px 14px;border-radius:16px;
    background:var(--ca-float);color:var(--ca-text);box-shadow:var(--ca-shadow);}
  .tag{font:500 11px/16px Inter,system-ui,sans-serif;color:var(--ca-muted);margin:0 0 10px;}
</style>
<body>
<div class="frame" id="shot">
  <div class="tag">#360 after · chat-done-video light — summary + 👍；zero chips</div>
  <div class="ca-process"><div class="ca-process__steps"><div class="ca-process__spine" aria-hidden="true"></div>
<div class="ca-process__row" data-kind="thought"><span class="ca-process__icon ca-process__icon--thought" data-kind="thought"><span class="ca-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 01-3-4 4.17 4.17 0 01-3 4"/></svg></span></span><span class="ca-process__label">Thought</span></div>
<div class="ca-process__row" data-kind="video"><span class="ca-process__icon ca-process__icon--video" data-kind="video"><span class="ca-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="14" x="3" y="5" rx="2"/><path d="m10 9 5 3-5 3z"/></svg></span></span><span class="ca-process__label">Generated video</span></div>
</div></div>
  <div class="ca-chat__results"><div class="thumb-ph" style="width:120px;height:120px"></div></div>
  <div class="ca-chat__done">
    <div class="ca-md">
      <p><strong>Generation complete:</strong> a 5s product clip.</p>
      <p>Next step: try a slower camera push, or export a square crop for social.</p>
    </div>
    <div class="ca-chat__feedback" data-testid="chat-done-feedback">
  <button type="button" class="ca-chat__fb" aria-label="Thumbs up"><span class="ca-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H4.5a1.5 1.5 0 0 1-1.5-1.5v-6A1.5 1.5 0 0 1 4.5 11H7z"/><path d="M7 11V9.2A3.2 3.2 0 0 1 10.2 6h.3l.8-2.2A1.8 1.8 0 0 1 13 2.5h.2A1.8 1.8 0 0 1 15 4.3V7h3.2a1.8 1.8 0 0 1 1.75 2.22l-1.2 5.1A2.5 2.5 0 0 1 16.3 16.5H7"/></svg></span></button>
  <button type="button" class="ca-chat__fb" aria-label="Thumbs down"><span class="ca-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 13V4h2.5A1.5 1.5 0 0 1 21 5.5v6A1.5 1.5 0 0 1 19.5 13H17z"/><path d="M17 13v1.8A3.2 3.2 0 0 1 13.8 18h-.3l-.8 2.2A1.8 1.8 0 0 1 11 21.5h-.2A1.8 1.8 0 0 1 9 19.7V17H5.8a1.8 1.8 0 0 1-1.75-2.22l1.2-5.1A2.5 2.5 0 0 1 7.7 7.5H17"/></svg></span></button>
</div>
  </div>
  <div class="ca-done-no-chips" aria-hidden="true"></div>
</div>
</body></html>
