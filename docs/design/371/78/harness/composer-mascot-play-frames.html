<!doctype html>
<html lang="zh"><meta charset="utf-8"/>
<title>#371 composer-mascot-play frames</title>
<link rel="stylesheet" href="tip.css"/>
<body data-theme="dark">
<div class="shot-tag">#371 after · play 多帧静帧：f0 / f5 / f8（≈0ms / 1250ms / 2000ms of 4250ms）</div>
<div style="display:flex;gap:20px;padding:40px 24px 24px;background:#111" id="shot">

  <div class="ca-composer" style="width:200px;min-height:100px">
    <span class="arti-mascot" style="background-image:url('mascot-lv1-developing.png');background-position:0px 0"></span>
    <div class="ca-composer__foot">frame 0</div>
  </div>

  <div class="ca-composer" style="width:200px;min-height:100px">
    <span class="arti-mascot" style="background-image:url('mascot-lv1-developing.png');background-position:-250px 0"></span>
    <div class="ca-composer__foot">frame 5</div>
  </div>

  <div class="ca-composer" style="width:200px;min-height:100px">
    <span class="arti-mascot" style="background-image:url('mascot-lv1-developing.png');background-position:-400px 0"></span>
    <div class="ca-composer__foot">frame 8</div>
  </div>

</div>
<p class="note" style="color:#888">Timing: 17 frames × 250ms = 4.25s one-shot. Classes: .arti-mascot--play · .arti-mascot--typing</p>
</body>
</html>
