<!doctype html>
<html lang="zh"><meta charset="utf-8"/>
<title>#371 composer-mascot-click-notify</title>
<link rel="stylesheet" href="tip.css"/>
<body data-theme="dark">
<div class="shot-tag">#371 after · click → 「Arti 通知」空态（非 /arti）</div>
<div class="stage" id="shot" style="padding-bottom:140px">
  <div class="ca-composer">
    <span class="arti-mascot-wrap">
      <button type="button" class="arti-mascot" data-testid="arti-mascot" data-level="1" data-trigger="idle"
        data-frames="17" data-frame-ms="250" data-duration-ms="4250"
        style="background-image:url('mascot-lv1-dna-a.png')" aria-label="Arti 通知"></button>
      <div class="arti-notify" role="dialog" data-testid="arti-notify">
        <div class="arti-notify__title">Arti 通知</div>
        <div class="arti-notify__empty" data-testid="arti-notify-empty">
          <div class="arti-notify__empty-title">暂无新通知</div>
          <div class="arti-notify__empty-hint">使用 Agent 创作后，解锁巡检和调研功能</div>
        </div>
      </div>
    </span>
    <textarea class="ca-composer__input" placeholder="有什么想法？尽管告诉 Arti…"></textarea>
    <div class="ca-composer__foot"><span>Agent</span><span style="margin-left:auto">↑</span></div>
  </div>
</div>
</body>
</html>
