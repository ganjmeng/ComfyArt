<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>#382 memory-updated row</title>
<style>
  :root {
    --ca-font: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    --ca-text: #1a1a1a;
    --ca-muted: #8a8a8a;
    --ca-float: #ffffff;
    --ca-border: #e6e6e6;
    --ca-bg: #f5f5f5;
    --ca-bubble: #f0f0f0;
  }
  html[data-theme="dark"] {
    --ca-text: #f2f2f2;
    --ca-muted: #9a9a9a;
    --ca-float: #1c1c1c;
    --ca-border: #2e2e2e;
    --ca-bg: #111;
    --ca-bubble: #242424;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ca-bg); color: var(--ca-text);
    font: 14px/1.45 var(--ca-font);
    display: flex; justify-content: center; padding: 40px 24px;
  }
  .chat {
    width: 360px; background: var(--ca-float); border: 1px solid var(--ca-border);
    border-radius: 16px; padding: 20px 18px 28px; min-height: 420px;
  }
  .user {
    background: var(--ca-bubble); border-radius: 12px; padding: 10px 12px; margin-bottom: 18px;
    font-size: 13px; color: var(--ca-text);
  }
  .ca-process { --col: 16px; --gutter: 12px; --step: 30px; --ico: 16px; position: relative; margin: 4px 0 14px; }
  .ca-process__spine {
    position: absolute; left: calc(var(--col) / 2 - 0.5px); top: 8px; bottom: 8px;
    width: 1px; background: color-mix(in srgb, var(--ca-muted) 55%, transparent);
  }
  .ca-process__row {
    display: grid; grid-template-columns: var(--col) var(--gutter) 1fr;
    align-items: center; height: var(--step); position: relative;
  }
  .ca-process__icon {
    width: var(--col); height: var(--ico); display: flex; align-items: center; justify-content: center;
    color: var(--ca-muted); background: var(--ca-float); position: relative; z-index: 1;
  }
  .ca-process__icon svg { width: 16px; height: 16px; }
  .ca-process__label {
    font: 500 13px/1 var(--ca-font); color: var(--ca-muted); white-space: nowrap;
  }
  .reply { font-size: 13.5px; line-height: 1.55; margin-top: 4px; }
  .hint { margin-top: 18px; font-size: 11px; color: var(--ca-muted); }
</style>
</head>
<body>
  <div class="chat" id="shot">
    <div class="user">只用文字回复，不要出图：请记住我偏爱暖色调，并用一句话描述这张图。</div>
    <div class="ca-process" data-testid="process">
      <div class="ca-process__spine" aria-hidden="true"></div>
      <div class="ca-process__row" data-kind="thought">
        <span class="ca-process__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 01-3-4 4.17 4.17 0 01-3 4"/><circle cx="12" cy="5" r="3"/></svg>
        </span>
        <span class="ca-process__label">思考完成</span>
      </div>
    </div>
    <div class="reply">已记住你的暖色调偏好。一句描述这张图：一杯带有心形拉花的拿铁放在洒满清晨阳光的木桌上。</div>
    <div class="hint">#382 · before · no memory-updated row (main)</div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>
</body>
</html>
